# This project's Epic Unreal MCP. Start the editor before the Codex session.
[mcp_servers.unreal_epic]
url = "http://127.0.0.1:8000/mcp"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120

# Merge with the installed user-level Blender server configuration.
[mcp_servers.blender.env]
DISABLE_TELEMETRY = "true"
